name: Validate WordPress code
on:
  push:
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint custom PHP
        run: find wp-content/themes/seven-s-racing wp-content/plugins/seven-s-core -name '*.php' -print0 | xargs -0 -n1 php -l

